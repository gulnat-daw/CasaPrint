<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CasaPrint | Catálogo de impresoras</title>

  <!-- Tipografías: Roboto (principal) y Open Sans (secundaria) -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Estilos comunes + estilos solo del catálogo (este va después) -->
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="container header__container">

      <!-- Logo -->
      <a href="index.html" class="logo">
        <img src="../imagenes/logo/LogoCasaPrintHeader.png" alt="CasaPrint" class="logo__img">
      </a>

      <!-- Barra de navegación -->
      <nav class="navbar" aria-label="Navegación principal">
        <ul class="navbar__list">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="catalogo.html">Catálogo</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>

        <div class="navbar__tools">
          <div class="navbar__tools">
            <form class="navbar__buscar" action="catalogo.html" method="get" role="search">
              <input type="search" name="q" class="navbar__search" placeholder="Buscar impresoras" aria-label="Buscar impresoras">
              <button type="submit" class="btn">Buscar</button>
            </form>
            <a href="cuenta.html">Mi cuenta</a>
            <a href="carrito.html">Carrito (<span id="carrito-contador">0</span>)</a>
          </div>
        </div>
      </nav>

    </div>
  </header>

    <!-- MAIN: contenido principal -->
    <div class="container carrito">

    <main class="carrito__main">
        <h1 class="carrito__title">Tu carrito</h1>
        <div id="carrito-lista" class="carrito__lista"></div>
    </main>

    <aside class="carrito__resumen">
        <h2 class="resumen__title">Resumen</h2>
        <p class="resumen__linea">Productos: <strong id="resumen-unidades">0</strong></p>
        <p class="resumen__linea resumen__total">Total: <strong id="resumen-total">0,00 €</strong></p>
        <button type="button" id="btn-finalizar" class="btn">Finalizar compra</button>
    </aside>

    </div>

    <!-- ===== FOOTER ===== -->
  <footer class="footer">

  <div class="container footer__container">

    <div class="footer__logo">
      <a href="index.html">
        <img src="../imagenes/logo/LogoCasaPrintHeader.png" alt="CasaPrint">
      </a>
    </div>

    <nav class="footer__nav" aria-label="Información de la empresa">
      <ul>
        <li><a href="quienes-somos.html">Quiénes somos</a></li>
        <li><a href="privacidad.html">Política de privacidad</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>

    <div class="footer__social">
      <a href="https://www.facebook.com/" aria-label="Facebook">
        <img src="../imagenes/logo/facebook-new.jpg" alt="Facebook">
      </a>
      <a href="https://www.instagram.com/" aria-label="Instagram">
        <img src="../imagenes/logo/instagram-new.jpg" alt="Instagram">
      </a>
      <a href="https://www.twitter.com/" aria-label="Twitter">
        <img src="../imagenes/logo/twitter-new.png" alt="Twitter">
      </a>
    </div>

  </div>

  <p class="footer__copy">© 2026 CasaPrint. Todos los derechos reservados.</p>
</footer>

    <script src="../js/productos.js"></script>
    <script src="../js/carrito.js"></script>
    <script src="../js/carrito-pagina.js"></script>

</body>
</html>
